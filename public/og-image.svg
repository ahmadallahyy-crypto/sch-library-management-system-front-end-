    <rect x="135" y="560" width="2" height="26"/>
    <rect x="141" y="560" width="5" height="26"/>
    <rect x="150" y="560" width="2" height="26"/>
    <rect x="156" y="560" width="6" height="26"/>
    <rect x="166" y="560" width="3" height="26"/>
    <rect x="173" y="560" width="2" height="26"/>
